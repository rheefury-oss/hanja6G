<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="한자퀴즈">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>한자 퀴즈</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #1e1e2e;
      --card:    #2a2a3e;
      --accent:  #7c6af7;
      --correct: #2ecc71;
      --wrong:   #e74c3c;
      --btn:     #35354f;
      --text:    #e0e0f0;
      --sub:     #8888aa;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
      -webkit-tap-highlight-color: transparent; user-select: none; }
    #app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0); }

    /* ── grade selection ── */
    #grade-screen { display:flex; flex-direction:column; align-items:center;
      justify-content:center; flex:1; padding:28px 20px; }
    #grade-screen h1 { font-size:28px; font-weight:700; margin-bottom:4px; }
    #grade-screen .sub { font-size:13px; color:var(--sub); margin-bottom:28px; }
    .grade-btn { width:100%; background:var(--card); color:var(--text);
      border:2px solid var(--btn); border-radius:16px; padding:18px 20px;
      margin:7px 0; text-align:left; cursor:pointer; font-family:inherit;
      transition:border-color .15s, transform .1s; }
    .grade-btn:active { transform:scale(.97); border-color:var(--accent); }
    .grade-btn .gt { font-size:17px; font-weight:700; }
    .grade-btn .gd { font-size:12px; color:var(--sub); margin-top:3px; }

    /* ── progress bar ── */
    #progress-bar-wrap { height:5px; background:var(--card); flex-shrink:0; }
    #progress-bar-fill { height:100%; background:var(--accent); width:0%;
      transition:width .35s ease; }
    /* ── header ── */
    #header { display:flex; justify-content:space-between; align-items:center;
      padding:12px 20px 8px; flex-shrink:0; }
    #lbl-progress { font-size:13px; color:var(--sub); }
    #lbl-score    { font-size:13px; font-weight:700; color:var(--accent); }
    /* ── type badge ── */
    #type-badge { text-align:center; flex-shrink:0; padding-bottom:6px; }
    .badge { display:inline-block; font-size:11px; font-weight:700;
      padding:3px 10px; border-radius:20px; letter-spacing:.5px; }
    .badge-char { background:#3a2a6e; color:#b09fff; }
    .badge-mc   { background:#1a3a2e; color:#5fd4a0; }
    .badge-sa   { background:#3a2a1e; color:#f4b96a; }
    /* ── card ── */
    #card { margin:0 16px; background:var(--card); border-radius:20px;
      display:flex; flex-direction:column; align-items:center;
      padding:16px 20px 20px; flex-shrink:0; min-height:155px; justify-content:center; }
    #lbl-prompt { font-size:12px; color:var(--sub); margin-bottom:10px; }
    #lbl-hanja  { font-size:clamp(80px,20vw,108px); font-weight:700; line-height:1; color:#fff; }
    #sentence-wrap { display:none; width:100%; }
    .sent-text { font-size:18px; line-height:1.9; text-align:center;
      color:var(--text); word-break:keep-all; }
    .word-hl { color:#a0e0ff; font-weight:700;
      border-bottom:2px solid #a0e0ff; padding-bottom:1px; }
    /* ── feedback ── */
    #feedback { text-align:center; font-size:14px; font-weight:700;
      min-height:22px; padding:9px 16px 2px; flex-shrink:0; }
    /* ── MC options ── */
    #options { display:grid; grid-template-columns:1fr 1fr; gap:9px;
      padding:8px 16px; flex-shrink:0; }
    .opt-btn { background:var(--btn); color:var(--text); border:none;
      border-radius:14px; padding:14px 8px; font-size:14px; font-family:inherit;
      cursor:pointer; transition:background .15s, transform .1s;
      line-height:1.4; word-break:keep-all; }
    .opt-btn:active { transform:scale(.96); }
    .opt-btn.correct { background:var(--correct); color:#fff; }
    .opt-btn.wrong   { background:var(--wrong);   color:#fff; }
    .opt-btn:disabled { cursor:default; }
    /* ── SA (short answer) ── */
    #sa-wrap { display:none; padding:8px 16px 0; flex-shrink:0; }
    #sa-input { width:100%; font-size:22px; padding:13px; border-radius:12px;
      background:var(--bg); color:var(--text); border:2px solid var(--btn);
      outline:none; text-align:center; font-family:inherit; }
    #sa-input:focus { border-color:var(--accent); }
    #btn-submit { display:none; width:calc(100% - 32px); margin:8px 16px 0;
      background:#2a3a4a; color:#8adcff; border:none; border-radius:14px;
      padding:14px; font-size:15px; font-weight:700; font-family:inherit;
      cursor:pointer; transition:background .15s; }
    #btn-submit:active { background:#1a2a3a; }
    /* ── confirm / next ── */
    #btn-confirm { display:none; margin:8px 16px 0; background:var(--accent);
      color:#fff; border:none; border-radius:14px; padding:15px;
      font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
      width:calc(100% - 32px); transition:background .15s, transform .1s; }
    #btn-confirm:active { transform:scale(.97); background:#6a5ae0; }
    .spacer { flex:1; }
    /* ── result ── */
    #result { display:none; flex-direction:column; align-items:center;
      justify-content:center; flex:1; padding:28px 24px; text-align:center; }
    #result h1 { font-size:24px; margin-bottom:16px; }
    .res-big { font-size:64px; font-weight:700; color:var(--accent); line-height:1; }
    .res-sub { font-size:15px; color:var(--sub); margin:4px 0 16px; }
    .res-breakdown { background:var(--card); border-radius:16px; padding:16px 24px;
      width:100%; margin-bottom:16px; text-align:left; }
    .res-row { display:flex; justify-content:space-between; font-size:14px;
      padding:4px 0; }
    .res-row .label { color:var(--sub); }
    .res-row .val   { font-weight:700; }
    .res-grade { font-size:20px; font-weight:700; margin-bottom:4px; }
    .res-msg   { font-size:14px; color:var(--sub); margin-bottom:24px; }
    #btn-restart { background:var(--accent); color:#fff; border:none;
      border-radius:14px; padding:14px 36px; font-size:16px; font-weight:700;
      font-family:inherit; cursor:pointer; margin-right:10px; }
    #btn-grade { background:var(--btn); color:var(--text); border:none;
      border-radius:14px; padding:14px 20px; font-size:15px; font-weight:700;
      font-family:inherit; cursor:pointer; }
  </style>
</head>
<body>
<div id="app">

<!-- ① 급수 선택 -->
<div id="grade-screen" style="display:flex;flex-direction:column;flex:1;">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;">
    <h1 style="font-size:28px;font-weight:700;margin-bottom:4px;">한자 퀴즈</h1>
    <p style="font-size:13px;color:var(--sub);margin-bottom:28px;">급수를 선택하세요</p>
    <button class="grade-btn" onclick="startGame('lv6')">
      <div class="gt">6급</div>
      <div class="gd">한국어문회 6급 배정 300자 · 총 40문제</div>
    </button>
    <button class="grade-btn" onclick="startGame('lv5')">
      <div class="gt">5급 신습</div>
      <div class="gd">5급 신습 200자 (6급 미포함) · 총 40문제</div>
    </button>
    <button class="grade-btn" onclick="startGame('all')">
      <div class="gt">5+6급 전체</div>
      <div class="gd">6급 300자 + 5급 신습 200자 · 총 40문제</div>
    </button>
    <p style="font-size:11px;color:var(--sub);margin-top:20px;">
      한자읽기 20 · 문장객관식 10 · 문장단답식 10
    </p>
  </div>
</div>

<!-- ② 퀴즈 화면 -->
<div id="quiz-screen" style="display:none;flex-direction:column;flex:1;">
  <div id="progress-bar-wrap"><div id="progress-bar-fill"></div></div>
  <div id="header">
    <span id="lbl-progress">문제 1 / 40</span>
    <span id="lbl-score">정답 0</span>
  </div>
  <div id="type-badge"><span id="badge" class="badge badge-char">한자 읽기</span></div>
  <div id="card">
    <div id="lbl-prompt"></div>
    <div id="lbl-hanja"></div>
    <div id="sentence-wrap"><p id="sentence-text" class="sent-text"></p></div>
  </div>
  <div id="feedback"></div>
  <div id="options">
    <button class="opt-btn" id="opt0" onclick="checkMC(0)"></button>
    <button class="opt-btn" id="opt1" onclick="checkMC(1)"></button>
    <button class="opt-btn" id="opt2" onclick="checkMC(2)"></button>
    <button class="opt-btn" id="opt3" onclick="checkMC(3)"></button>
  </div>
  <div id="sa-wrap">
    <input type="text" id="sa-input" placeholder="한글로 입력 후 제출" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>
  <button id="btn-submit" onclick="checkSA()">제출</button>
  <button id="btn-confirm" onclick="nextQuestion()"></button>
  <div class="spacer"></div>
</div>

<!-- ③ 결과 화면 -->
<div id="result" style="display:none;flex-direction:column;flex:1;">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">
    <h1>퀴즈 완료!</h1>
    <div class="res-big" id="res-total"></div>
    <div class="res-sub" id="res-outof"></div>
    <div class="res-breakdown">
      <div class="res-row"><span class="label">한자 읽기 (객관식)</span><span class="val" id="r-char"></span></div>
      <div class="res-row"><span class="label">문장 읽기 (객관식)</span><span class="val" id="r-mc"></span></div>
      <div class="res-row"><span class="label">문장 읽기 (단답식)</span><span class="val" id="r-sa"></span></div>
    </div>
    <div class="res-grade" id="res-grade"></div>
    <div class="res-msg"   id="res-msg"></div>
    <div>
      <button id="btn-restart" onclick="restartSameGrade()">다시 시작</button>
      <button id="btn-grade"   onclick="goGradeSelect()">급수 변경</button>
    </div>
  </div>
</div>

</div><!-- #app -->

  {t:"병원에서 {患者}를 돕습니다.",            a:"환자", w:["환경","자환","환난"]},
];

const ALL_CHAR=[...DATA_6,...DATA_5];
const TOTAL=40, CHAR_N=20, MC_N=10, SA_N=10;
const RED_W=3;

let questions=[],qIdx=0,score=0,charScore=0,mcScore=0,saScore=0;
let answered=false,correctIdx=0,currentGrade=null;

// ── 급수 선택 ────────────────────────────────────────
function startGame(grade){
  initAudio(); // 첫 터치 시점에 AudioContext 활성화
  currentGrade=grade;
  document.getElementById('grade-screen').style.display='none';
  document.getElementById('quiz-screen').style.display='flex';
  questions=sampleQuestions(grade);
  qIdx=0;score=0;charScore=0;mcScore=0;saScore=0;answered=false;
  showQuestion();
}
function restartSameGrade(){ startGame(currentGrade); }
function goGradeSelect(){
  document.getElementById('result').style.display='none';
  document.getElementById('grade-screen').style.display='flex';
}

// ── 문제 샘플링 ───────────────────────────────────────
function sampleQuestions(grade){
  const charData = grade==='lv6'?DATA_6 : grade==='lv5'?DATA_5 : ALL_CHAR;
  const sentData = grade==='lv6'?SENT_6 : grade==='lv5'?SENT_5 : [...SENT_6,...SENT_5];

  // 한자 읽기 20개
  const pool=[];
  charData.forEach(d=>{ const w=d[3]?RED_W:1; for(let i=0;i<w;i++) pool.push(d); });
  shuffle(pool);
  const seen=new Set(),charQs=[];
  for(const d of pool){
    if(!seen.has(d[0])){ seen.add(d[0]); charQs.push({type:'char',d}); }
    if(charQs.length===CHAR_N) break;
  }

  // 문장 MC 10개 + SA 10개 (중복 없이)
  const sh=shuffle([...sentData]);
  const mcQs=sh.slice(0,MC_N).map(d=>({type:'mc_sent',d}));
  const saQs=sh.slice(MC_N,MC_N+SA_N).map(d=>({type:'sa_sent',d}));

  return shuffle([...charQs,...mcQs,...saQs]);
}

// ── 문제 표시 ─────────────────────────────────────────
function showQuestion(){
  if(qIdx>=TOTAL){ showResult(); return; }
  const q=questions[qIdx];
  answered=false;
  document.getElementById('lbl-progress').textContent=`문제 ${qIdx+1} / ${TOTAL}`;
  document.getElementById('lbl-score').textContent=`정답 ${score}`;
  document.getElementById('progress-bar-fill').style.width=`${qIdx/TOTAL*100}%`;
  document.getElementById('btn-confirm').style.display='none';
  document.getElementById('feedback').textContent='';

  // 공통: 숨기기
  document.getElementById('options').style.display='grid';
  document.getElementById('sa-wrap').style.display='none';
  document.getElementById('btn-submit').style.display='none';

  if(q.type==='char')     showChar(q.d);
  else if(q.type==='mc_sent') showMC(q.d);
  else                    showSA(q.d);
}

function showChar(d){
  setBadge('한자 읽기','badge-char');
  document.getElementById('lbl-prompt').textContent='이 한자의 뜻과 소리는?';
  document.getElementById('lbl-hanja').textContent=d[0];
  document.getElementById('lbl-hanja').style.display='';
  document.getElementById('sentence-wrap').style.display='none';

  const corr=`${d[1]}  ${d[2]}`;
  const pool=ALL_CHAR.filter(x=>x[0]!==d[0]&&`${x[1]}  ${x[2]}`!==corr);
  const opts=shuffle([...shuffle(pool).slice(0,3).map(x=>`${x[1]}  ${x[2]}`),corr]);
  correctIdx=opts.indexOf(corr);
  setOpts(opts);
}

function showMC(d){
  setBadge('문장 읽기 (객관식)','badge-mc');
  setSent(d);
  const opts=shuffle([...d.w,d.a]);
  correctIdx=opts.indexOf(d.a);
  setOpts(opts);
}

function showSA(d){
  setBadge('문장 읽기 (단답식)','badge-sa');
  setSent(d);
  document.getElementById('options').style.display='none';
  document.getElementById('sa-wrap').style.display='block';
  document.getElementById('btn-submit').style.display='block';
  const inp=document.getElementById('sa-input');
  inp.value=''; inp.disabled=false;
  setTimeout(()=>inp.focus(),100);
}

function setSent(d){
  document.getElementById('lbl-prompt').textContent='파란색 한자 단어의 소리는?';
  document.getElementById('lbl-hanja').style.display='none';
  document.getElementById('sentence-wrap').style.display='block';
  document.getElementById('sentence-text').innerHTML=
    d.t.replace(/\{(.+?)\}/g,(_,w)=>`<span class="word-hl">${w}</span>`);
}

function setOpts(opts){
  for(let i=0;i<4;i++){
    const b=document.getElementById(`opt${i}`);
    b.textContent=opts[i]; b.className='opt-btn'; b.disabled=false;
  }
}
function setBadge(text,cls){
  const b=document.getElementById('badge');
  b.textContent=text; b.className='badge '+cls;
}

// ── 정답 체크 (MC) ────────────────────────────────────
function checkMC(idx){
  if(answered) return;
  answered=true;
  for(let i=0;i<4;i++) document.getElementById(`opt${i}`).disabled=true;

  const q=questions[qIdx];
  const isChar=q.type==='char';
  const d=q.d;
  const label=isChar?`${d[0]} = ${d[1]}  ${d[2]}`
                     :`${d.t.match(/\{(.+?)\}/)[1]} = ${d.a}`;
  if(idx===correctIdx){
    score++; if(isChar) charScore++; else mcScore++;
    playCorrect();
    document.getElementById(`opt${idx}`).classList.add('correct');
    showFB(`정답!  ${label}`,'var(--correct)');
    document.getElementById('btn-confirm').textContent='다음 문제  →';
  } else {
    playWrong();
    document.getElementById(`opt${idx}`).classList.add('wrong');
    document.getElementById(`opt${correctIdx}`).classList.add('correct');
    showFB(`오답!  정답:  ${label}`,'var(--wrong)');
    document.getElementById('btn-confirm').textContent='확인';
  }
  document.getElementById('lbl-score').textContent=`정답 ${score}`;
  document.getElementById('btn-confirm').style.display='block';
}

// ── 정답 체크 (SA) ────────────────────────────────────
function checkSA(){
  if(answered) return;
  answered=true;
  const inp=document.getElementById('sa-input');
  const typed=inp.value.trim();
  const d=questions[qIdx].d;
  const word=d.t.match(/\{(.+?)\}/)[1];
  inp.disabled=true;
  document.getElementById('btn-submit').style.display='none';

  if(typed===d.a){
    saScore++; score++;
    playCorrect();
    inp.style.borderColor='var(--correct)';
    showFB(`정답!  ${word} = ${d.a}`,'var(--correct)');
    document.getElementById('btn-confirm').textContent='다음 문제  →';
  } else {
    playWrong();
    inp.style.borderColor='var(--wrong)';
    showFB(`오답!  정답:  ${word} = ${d.a}`,'var(--wrong)');
    document.getElementById('btn-confirm').textContent='확인';
  }
  document.getElementById('lbl-score').textContent=`정답 ${score}`;
  document.getElementById('btn-confirm').style.display='block';
}

function nextQuestion(){ qIdx++; showQuestion(); }
function showFB(msg,color){
  const f=document.getElementById('feedback');
  f.textContent=msg; f.style.color=color;
}

// ── 결과 화면 ─────────────────────────────────────────
function showResult(){
  document.getElementById('quiz-screen').style.display='none';
  const res=document.getElementById('result');
  res.style.display='flex';
  document.getElementById('progress-bar-fill').style.width='100%';

  const pct=Math.round(score/TOTAL*100);
  document.getElementById('res-total').textContent=score;
  document.getElementById('res-outof').textContent=`/ ${TOTAL}문제  (정답률 ${pct}%)`;
  document.getElementById('r-char').textContent=`${charScore} / ${CHAR_N}`;
  document.getElementById('r-mc').textContent=`${mcScore} / ${MC_N}`;
  document.getElementById('r-sa').textContent=`${saScore} / ${SA_N}`;

  let grade,color,msg;
  if(pct>=90)      {grade='우수 🎉';color='var(--correct)';msg='합격 확실! 정말 잘 하셨어요.';}
  else if(pct>=70) {grade='양호 👍';color='#f39c12';       msg='조금만 더 연습하면 완벽해요!';}
  else if(pct>=50) {grade='보통 📚';color='var(--accent)'; msg='틀린 한자를 다시 복습해 보세요.';}
  else             {grade='노력 필요 💪';color='var(--wrong)';msg='기초부터 차근차근 공부해 봐요!';}
  document.getElementById('res-grade').textContent=grade;
  document.getElementById('res-grade').style.color=color;
  document.getElementById('res-msg').textContent=msg;
}

// ── 효과음 ───────────────────────────────────────────
// 단일 AudioContext 재사용 (Android: 매번 생성 시 suspended 문제 방지)
let _ac = null;
function getAC() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  return _ac;
}
function initAudio() {
  try { getAC().resume(); } catch(e) {}
}

function playCorrect(){
  try{
    const c=getAC();
    c.resume().then(()=>{
      [[880,0,.18],[1109,.2,.38]].forEach(([f,s,e])=>{
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(.35,c.currentTime+s);
        g.gain.exponentialRampToValueAtTime(.001,c.currentTime+e);
        o.start(c.currentTime+s);o.stop(c.currentTime+e);
      });
    });
  }catch(e){}
}
function playWrong(){
  try{
    const c=getAC();
    c.resume().then(()=>{
      const o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);o.type='sawtooth';
      o.frequency.setValueAtTime(220,c.currentTime);
      o.frequency.exponentialRampToValueAtTime(110,c.currentTime+.3);
      g.gain.setValueAtTime(.3,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3);
      o.start(c.currentTime);o.stop(c.currentTime+.3);
    });
  }catch(e){}
}

// ── 유틸 ─────────────────────────────────────────────
function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

// ── Enter 키로 SA 제출 ────────────────────────────────
document.getElementById('sa-input').addEventListener('keydown',e=>{
  if(e.key==='Enter') checkSA();
});

// ── PWA ──────────────────────────────────────────────
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
