<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="한자퀴즈">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>한자 퀴즈 6급</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1e1e2e;
      --card:    #2a2a3e;
      --accent:  #7c6af7;
      --correct: #2ecc71;
      --wrong:   #e74c3c;
      --btn:     #35354f;
      --text:    #e0e0f0;
      --sub:     #8888aa;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    }

    /* ── progress bar ── */
    #progress-bar-wrap { height: 5px; background: var(--card); flex-shrink: 0; }
    #progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width .35s ease; }

    /* ── header ── */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px 10px;
      flex-shrink: 0;
    }
    #lbl-progress { font-size: 13px; color: var(--sub); }
    #lbl-score    { font-size: 13px; font-weight: 700; color: var(--accent); }

    /* ── hanja card ── */
    #card {
      margin: 0 16px;
      background: var(--card);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 24px;
      flex-shrink: 0;
    }
    #lbl-prompt { font-size: 13px; color: var(--sub); margin-bottom: 10px; }
    #lbl-hanja  {
      font-size: clamp(88px, 22vw, 120px);
      font-weight: 700;
      line-height: 1;
      color: #fff;
    }

    /* ── feedback ── */
    #feedback {
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      min-height: 26px;
      padding: 12px 16px 4px;
      flex-shrink: 0;
    }

    /* ── options ── */
    #options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 8px 16px;
      flex-shrink: 0;
    }
    .opt-btn {
      background: var(--btn);
      color: var(--text);
      border: none;
      border-radius: 14px;
      padding: 16px 8px;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, transform .1s;
      line-height: 1.4;
      word-break: keep-all;
    }
    .opt-btn:active { transform: scale(.96); }
    .opt-btn.correct { background: var(--correct); color: #fff; }
    .opt-btn.wrong   { background: var(--wrong);   color: #fff; }
    .opt-btn:disabled { cursor: default; }

    /* ── confirm/next button ── */
    #btn-confirm {
      display: none;
      margin: 10px 16px 0;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      width: calc(100% - 32px);
      transition: background .15s, transform .1s;
    }
    #btn-confirm:active { transform: scale(.97); background: #6a5ae0; }

    /* spacer */
    .spacer { flex: 1; }

    /* ── result screen ── */
    #result {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 32px 24px;
      text-align: center;
    }
    #result h1 { font-size: 28px; margin-bottom: 12px; }
    #result .big-score {
      font-size: 72px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    #result .out-of { font-size: 18px; color: var(--sub); margin: 4px 0 16px; }
    #result .grade  { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    #result .msg    { font-size: 15px; color: var(--sub); margin-bottom: 36px; }
    #btn-restart {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px 40px;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }
    #btn-restart:active { background: #6a5ae0; }
  </style>
</head>
<body>
<div id="app">
  <!-- quiz screen -->
  <div id="quiz-screen" style="display:flex;flex-direction:column;flex:1;">
    <div id="progress-bar-wrap"><div id="progress-bar-fill"></div></div>

    <div id="header">
      <span id="lbl-progress">문제 1 / 20</span>
      <span id="lbl-score">정답 0</span>
    </div>

    <div id="card">
      <div id="lbl-prompt">이 한자의 뜻과 소리는?</div>
      <div id="lbl-hanja">漢</div>
    </div>

    <div id="feedback"></div>

    <div id="options">
      <button class="opt-btn" id="opt0" onclick="checkAnswer(0)"></button>
      <button class="opt-btn" id="opt1" onclick="checkAnswer(1)"></button>
      <button class="opt-btn" id="opt2" onclick="checkAnswer(2)"></button>
      <button class="opt-btn" id="opt3" onclick="checkAnswer(3)"></button>
    </div>

    <button id="btn-confirm" onclick="nextQuestion()"></button>
    <div class="spacer"></div>
  </div>

  <!-- result screen -->
  <div id="result">
    <h1>퀴즈 완료!</h1>
    <div class="big-score" id="res-score"></div>
    <div class="out-of" id="res-outof"></div>
    <div class="grade"  id="res-grade"></div>
    <div class="msg"    id="res-msg"></div>
    <button id="btn-restart" onclick="startGame()">다시 시작</button>
  </div>
</div>

const TOTAL = 20;
const RED_W = 3;

let questions = [], qIdx = 0, score = 0, correctIdx = 0, answered = false;

// ── sampling ──────────────────────────────────────────────────────────────
function sampleQuestions() {
  const pool = [];
  DATA.forEach(d => {
    const w = d[3] ? RED_W : 1;
    for (let i = 0; i < w; i++) pool.push(d);
  });
  // Fisher-Yates shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const seen = new Set(), result = [];
  for (const d of pool) {
    if (!seen.has(d[0])) { seen.add(d[0]); result.push(d); }
    if (result.length === TOTAL) break;
  }
  return result;
}

// ── game flow ─────────────────────────────────────────────────────────────
function startGame() {
  questions = sampleQuestions();
  qIdx = 0; score = 0; answered = false;
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'flex';
  showQuestion();
}

function showQuestion() {
  if (qIdx >= TOTAL) { showResult(); return; }

  const q = questions[qIdx];
  answered = false;

  // header
  document.getElementById('lbl-progress').textContent = `문제 ${qIdx + 1} / ${TOTAL}`;
  document.getElementById('lbl-score').textContent = `정답 ${score}`;
  document.getElementById('progress-bar-fill').style.width = `${qIdx / TOTAL * 100}%`;

  // card
  document.getElementById('lbl-hanja').textContent = q[0];
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').style.color = 'var(--sub)';

  // hide confirm
  const confirmBtn = document.getElementById('btn-confirm');
  confirmBtn.style.display = 'none';

  // build options
  const correctLabel = `${q[1]}  ${q[2]}`;
  const candidates = DATA.filter(d => d[0] !== q[0] && `${d[1]}  ${d[2]}` !== correctLabel);
  const wrongs = shuffle(candidates).slice(0, 3);
  const opts = shuffle([...wrongs.map(d => `${d[1]}  ${d[2]}`), correctLabel]);
  correctIdx = opts.indexOf(correctLabel);

  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById(`opt${i}`);
    btn.textContent = opts[i];
    btn.className = 'opt-btn';
    btn.disabled = false;
  }
}

function checkAnswer(idx) {
  if (answered) return;
  answered = true;

  for (let i = 0; i < 4; i++) document.getElementById(`opt${i}`).disabled = true;

  const q = questions[qIdx];
  const confirmBtn = document.getElementById('btn-confirm');

  if (idx === correctIdx) {
    score++;
    document.getElementById(`opt${idx}`).classList.add('correct');
    document.getElementById('feedback').textContent = `정답!  ${q[0]} = ${q[1]}  ${q[2]}`;
    document.getElementById('feedback').style.color = 'var(--correct)';
    confirmBtn.textContent = '다음 문제  →';
  } else {
    document.getElementById(`opt${idx}`).classList.add('wrong');
    document.getElementById(`opt${correctIdx}`).classList.add('correct');
    document.getElementById('feedback').textContent = `오답!  정답:  ${q[0]} = ${q[1]}  ${q[2]}`;
    document.getElementById('feedback').style.color = 'var(--wrong)';
    confirmBtn.textContent = '확인';
  }

  document.getElementById('lbl-score').textContent = `정답 ${score}`;
  confirmBtn.style.display = 'block';
}

function nextQuestion() {
  qIdx++;
  showQuestion();
}

// ── result ────────────────────────────────────────────────────────────────
function showResult() {
  document.getElementById('quiz-screen').style.display = 'none';
  const res = document.getElementById('result');
  res.style.display = 'flex';

  const pct = Math.round(score / TOTAL * 100);
  let grade, color, msg;
  if (pct >= 90)      { grade = '우수 🎉';       color = 'var(--correct)'; msg = '6급 합격 확실! 정말 잘 하셨어요.'; }
  else if (pct >= 70) { grade = '양호 👍';       color = '#f39c12';        msg = '조금만 더 연습하면 완벽해요!'; }
  else if (pct >= 50) { grade = '보통 📚';       color = 'var(--accent)';  msg = '틀린 한자를 다시 복습해 보세요.'; }
  else                { grade = '노력 필요 💪';  color = 'var(--wrong)';   msg = '기초부터 차근차근 공부해 봐요!'; }

  document.getElementById('res-score').textContent = score;
  document.getElementById('res-outof').textContent = `/ ${TOTAL}문제  (정답률 ${pct}%)`;
  document.getElementById('res-grade').textContent = grade;
  document.getElementById('res-grade').style.color = color;
  document.getElementById('res-msg').textContent = msg;

  document.getElementById('progress-bar-fill').style.width = '100%';
}

// ── utils ─────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── service worker ────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ── start ─────────────────────────────────────────────────────────────────
startGame();
</script>
